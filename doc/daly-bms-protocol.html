def build_request(cmd_id: int, host_addr: int = ${n}) -> bytes:
    frame = bytearray([0xA5, host_addr, cmd_id, 0x08, 0, 0, 0, 0, 0, 0, 0, 0])
    checksum = sum(frame) & 0xFF
    frame.append(checksum)
    return bytes(frame)

def verify_frame(frame: bytes) -> bool:
    return (
        len(frame) == 13
        and frame[0] == 0xA5
        and frame[3] == 0x08
        and (sum(frame[:12]) & 0xFF) == frame[12]
    )

def parse_0x90_soc_and_pack(frame: bytes) -> dict:
    total_v = int.from_bytes(frame[4:6], "big") * 0.1
    gather_v = int.from_bytes(frame[6:8], "big") * 0.1
    current_a = (int.from_bytes(frame[8:10], "big") - 30000) * 0.1
    soc_pct = int.from_bytes(frame[10:12], "big") * 0.1
    return {"voltage_v": round(total_v, 1), "gather_v": round(gather_v, 1),
            "current_a": round(current_a, 1), "soc_percent": round(soc_pct, 1)}

def read_all_cells_0x95(ser: serial.Serial, cell_count: int) -> list[int]:

void buildDalyRequest(uint8_t cmdId, uint8_t outFrame[13]) {
  outFrame[0] = 0xA5;
  outFrame[1] = ${n}; // Host address (0x40 PC / 0x80 BT)
  outFrame[2] = cmdId;
  outFrame[3] = 0x08;
  uint16_t sum = outFrame[0] + outFrame[1] + outFrame[2] + outFrame[3];
  for (int i = 4; i < 12; i++) {
    outFrame[i] = 0x00;
  }
  outFrame[12] = (uint8_t)(sum & 0xFF);
}

bool verifyDalyFrame(const uint8_t frame[13]) {
  if (frame[0] != 0xA5 || frame[3] != 0x08) return false;
  uint16_t sum = 0;
  for (int i = 0; i < 12; i++) sum += frame[i];
  return (uint8_t)(sum & 0xFF) == frame[12];
}
